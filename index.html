<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三目並べ</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFFFE0;
      --accent: #8A2BE2;
      --accent2: #8A2BE2;
      --cell-bg: rgba(20, 20, 40, 0.9);
      --cell-border: #8A2BE2;
      --win-highlight: #ffff33;
      --text-color: #000;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    header {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.1);
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 0 15px var(--accent);
    }

    header button, .back-button {
      font-family: 'Orbitron', sans-serif;
      background: var(--accent);
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }

    header button:hover, .back-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px var(--accent2);
    }

    #status {
      margin: 0.5rem;
      font-size: 1.2rem;
      text-shadow: 0 0 10px var(--accent2);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 0.5vmin;
      width: 90vmin;
      height: 90vmin;
      margin: auto;
      box-sizing: border-box;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12vmin;
      background: var(--cell-bg);
      border: 2px solid var(--cell-border);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      user-select: none;
      color: #fff;
    }

    .cell:hover {
      background: rgba(138, 43, 226, 0.2);
      transform: scale(1.05);
    }

    .cell.winner {
      background: var(--win-highlight);
      color: black;
    }

    .scoreboard {
      margin: 1rem;
      display: flex;
      gap: 2rem;
      font-size: 1.2rem;
      text-shadow: 0 0 10px var(--accent);
    }

    .bottom-controls {
      margin: 1rem;
      display: flex;
      justify-content: flex-end;
      width: 90vmin;
    }

    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <button id="newRound">新しいラウンド</button>
    <button id="resetScores">スコアをリセット</button>
  </header>
  <div id="status" role="status" aria-live="polite">プレイヤー X の番です</div>
  <div class="board" role="grid" aria-label="三目並べの盤面">
    <div class="cell" role="gridcell" data-index="0"></div>
    <div class="cell" role="gridcell" data-index="1"></div>
    <div class="cell" role="gridcell" data-index="2"></div>
    <div class="cell" role="gridcell" data-index="3"></div>
    <div class="cell" role="gridcell" data-index="4"></div>
    <div class="cell" role="gridcell" data-index="5"></div>
    <div class="cell" role="gridcell" data-index="6"></div>
    <div class="cell" role="gridcell" data-index="7"></div>
    <div class="cell" role="gridcell" data-index="8"></div>
  </div>
  <div class="scoreboard">
    <div>X: <span id="scoreX">0</span></div>
    <div>O: <span id="scoreO">0</span></div>
    <div>引き分け: <span id="scoreDraw">0</span></div>
  </div>
  <div class="bottom-controls">
    <a href="https://design-pull.com/" class="back-button" target="_blank" rel="noopener noreferrer">サイトに戻る</a>
  </div>
  <canvas id="confetti"></canvas>

  <script>
    const boardEl = document.querySelector('.board');
    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreDrawEl = document.getElementById('scoreDraw');
    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let scores = { X: 0, O: 0, Draw: 0 };
    let confettiActive = false;

    const winPatterns = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function checkWinner() {
      for (let pattern of winPatterns) {
        const [a,b,c] = pattern;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          cells[a].classList.add('winner');
          cells[b].classList.add('winner');
          cells[c].classList.add('winner');
          return board[a];
        }
      }
      if (board.every(cell => cell)) return 'Draw';
      return null;
    }

    function handleClick(e) {
      const index = e.target.dataset.index;
      if (!board[index]) {
        board[index] = currentPlayer;
        e.target.textContent = currentPlayer;
        const winner = checkWinner();
        if (winner) {
          if (winner === 'Draw') {
            scores.Draw++;
            scoreDrawEl.textContent = scores.Draw;
            statusEl.textContent = "引き分けです！";
          } else {
            scores[winner]++;
            scoreXEl.textContent = scores.X;
            scoreOEl.textContent = scores.O;
            statusEl.textContent = `${winner} の勝ちです！`;
            launchConfetti();
          }
          boardEl.style.pointerEvents = 'none';
        } else {
          currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
          statusEl.textContent = `プレイヤー ${currentPlayer} の番です`;
        }
      }
    }

    cells.forEach(cell => cell.addEventListener('click', handleClick));

    document.getElementById('newRound').addEventListener('click', () => {
      board = Array(9).fill(null);
      cells.forEach(c => {
        c.textContent = '';
        c.classList.remove('winner');
      });
      boardEl.style.pointerEvents = 'auto';
      currentPlayer = 'X';
      statusEl.textContent = `プレイヤー ${currentPlayer} の番です`;
      stopConfetti();
    });

    document.getElementById('resetScores').addEventListener('click', () => {
      scores = { X: 0, O: 0, Draw: 0 };
      scoreXEl.textContent = 0;
      scoreOEl.textContent = 0;
      scoreDrawEl.textContent = 0;
    });

    // コンフェッティ演出
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function launchConfetti() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      particles = [];
      for (let i = 0; i < 100; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 5 + 2,
          speed: Math.random() * 3 + 2,
          color: Math.random() > 0.5 ? varAccent() : varAccent2(),
        });
      }
      confettiActive = true;
      requestAnimationFrame(updateConfetti);
    }

    function stopConfetti() {
      confettiActive = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = [];
    }

    function varAccent() { return '#8A2BE2'; }
    function varAccent2() { return '#8A2BE2'; }

    function updateConfetti() {
      if (!confettiActive) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        p.y += p.speed;
        if (p.y > canvas.height) p.y = -10;
      }
      if (particles.length > 0) requestAnimationFrame(updateConfetti);
    }
  </script>
</body>
</html>
